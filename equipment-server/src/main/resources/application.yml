server:
  port: ${SERVER_PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import:
      - optional:classpath:application-env.yml
      - optional:file:./application-env.yml
  main:
    allow-circular-references: true
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/electric_equipment_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:change-me}
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:change-me}
      timeout: 3000ms

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: "default"
      paths-to-match: "/**"
      packages-to-scan: com.github.xiaoymin.boot3
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.power.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      power:
        mapper: debug
        service: info
        controller: info

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

power:
  upload-dir: ${UPLOAD_DIR:./uploads}
  jwt:
    admin-secret-key: ${JWT_ADMIN_SECRET:change-this-admin-secret-before-production}
    admin-ttl: ${JWT_ADMIN_TTL:7200000}
    admin-token-name: token
    user-secret-key: ${JWT_USER_SECRET:change-this-user-secret-before-production}
    user-ttl: ${JWT_USER_TTL:7200000}
    user-token-name: authentication
